<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

<div class="deck" id="deck">
  <div class="deck__progress" id="deckProgress"></div>

  <div class="deck__frame">
    <header class="deck__meta-row">
      <div class="deck__brand" id="deckBrand">PORTFOLIO</div>
      <div class="deck__counter" id="deckCounter">01 / 01</div>
    </header>

    <main class="deck__slide-root" id="slideRoot" aria-live="polite"></main>
  </div>

  <button class="deck__nav deck__nav--prev" id="navPrev" aria-label="이전 슬라이드">&#8249;</button>
  <button class="deck__nav deck__nav--next" id="navNext" aria-label="다음 슬라이드">&#8250;</button>
  <div class="deck__hint">방향키 / 클릭 / 스와이프로 이동</div>
</div>

<script src="assets/js/icons.js"></script>
